name: fitlek1
description: SIRVYA - Premium Fitness Coach App
publish_to: 'none'
version: 1.0.2+19

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  http_parser: ^4.0.2
  google_sign_in: ^6.2.1
  firebase_auth: ^6.6.1
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  google_maps_flutter: ^2.5.0
  url_launcher: ^6.2.0
  image_picker: ^1.2.2
  flutter_image_compress: ^2.5.1
  image: ^4.9.2
  sqflite: ^2.4.4
  path: ^1.9.1
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0
  app_links: ^7.0.0
  share_plus: ^12.0.1
  mobile_scanner: ^7.0.0
  shared_preferences: ^2.3.2
  file_picker: ^8.0.0
  flutter_svg: ^2.3.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.1.0
  package_info_plus: ^9.0.1
  video_player: ^2.14.0
  flutter_dotenv: ^6.0.1
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.7
  record: ^7.1.1
  path_provider: ^2.1.6
  cached_network_image: ^4.0.0
  flutter_cache_manager: ^3.4.2
  socket_io_client: ^3.1.6
  workmanager: ^0.10.10
  geolocator: ^14.0.2
  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  image_path: "assets/branding/icon_app_dark.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/branding/icon_app_dark.png"
  windows:
    generate: true
    image_path: "assets/branding/icon_app_dark.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/sounds/
    - assets/config.env
